services:
  - type: web
    name: adotaperto-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev --legacy-peer-deps
    startCommand: npm run db:setup && npm run start
    healthCheckPath: /status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: adotaperto-images
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: adotaperto-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: VIACEP_BASE_URL
        value: https://viacep.com.br/ws
      - key: NOMINATIM_SEARCH_URL
        value: https://nominatim.openstreetmap.org/search
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
      - key: WIKIMEDIA_FILE_URL
        value: https://commons.wikimedia.org/wiki/Special:Redirect/file
      - key: AUTH_EMAIL_FROM
        value: AdotaPerto <onboarding@resend.dev>

  - type: web
    name: adotaperto-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: adotaperto-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MAP_STYLE_LIGHT_URL
        value: https://tiles.openfreemap.org/styles/positron
      - key: NEXT_PUBLIC_MAP_STYLE_DARK_URL
        value: https://tiles.openfreemap.org/styles/dark
