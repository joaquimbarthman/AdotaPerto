services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB não definida no .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER não definida no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definida no .env}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT não definida no .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY não definida no .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY não definida no .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT não definida no .env}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT não definida no .env}:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
