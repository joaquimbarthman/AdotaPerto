services:
  - type: web
    name: adotaperto
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: adotaperto-images
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: VIACEP_BASE_URL
        value: https://viacep.com.br/ws
      - key: NOMINATIM_SEARCH_URL
        value: https://nominatim.openstreetmap.org/search
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
      - key: WIKIMEDIA_FILE_URL
        value: https://commons.wikimedia.org/wiki/Special:Redirect/file
      - key: GOOGLE_MAPS_SEARCH_URL
        value: https://www.google.com/maps/search
