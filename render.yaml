services:
  - type: web
    name: adotaperto-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev --legacy-peer-deps
    startCommand: npm run db:setup && npm run start
    healthCheckPath: /status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: RUSTFS_ENDPOINT
        sync: false
      - key: RUSTFS_API_PORT
        value: "443"
      - key: RUSTFS_USE_SSL
        value: "true"
      - key: RUSTFS_BUCKET
        sync: false
      - key: RUSTFS_ACCESS_KEY
        sync: false
      - key: RUSTFS_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        value: AdotaPerto <onboarding@resend.dev>

  - type: web
    name: adotaperto-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
