services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB não definida no .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER não definida no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definida no .env}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT não definida no .env}:5432"

  storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER não definida no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD não definida no .env}
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT não definida no .env}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT não definida no .env}:9001"
